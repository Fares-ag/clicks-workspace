name: clicks_technician
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  easy_localization: ^3.0.7+1
  equatable: ^2.0.7
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  intl: any
  pretty_dio_logger: ^1.4.0
  responsive_builder: ^0.7.1
  shared_preferences: ^2.5.2
  geolocator: ^14.0.2
  google_maps_flutter: ^2.6.1
  flutter_polyline_points: ^2.1.0
  socket_io_client: ^3.1.3
  shimmer: ^3.0.0
  pinput: ^5.0.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.9
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/translations/


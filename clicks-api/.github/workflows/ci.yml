name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-smoke:
    name: API auth smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install admin-api deps
        working-directory: clicks-admin-api
        run: npm ci || npm install
      - name: Install customer-tech-api deps
        working-directory: clicks-customer-tech-api
        run: npm ci || npm install
      - name: Install shared deps
        working-directory: clicks-shared
        run: npm ci || npm install
      - name: Start APIs (mock env)
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/clicks_ci
          JWT_SECRET: ci-jwt-secret-shared
          JWT_REFRESH_SECRET: ci-jwt-refresh
          INTERNAL_API_SECRET: ci-internal-secret
          CORS_ORIGINS: http://localhost:3000
          CUSTOMER_TECH_API_URL: http://127.0.0.1:5001
          LAUNCH_PUBLIC_SOS: "true"
          LAUNCH_PUBLIC_SIGNUP: "true"
        run: |
          # Smoke script only needs HTTP 401/200 responses; APIs may fail Mongo —
          # prefer hitting a running staging via workflow_dispatch secrets.
          # Local CI: run smoke against health if mongo unavailable skip start.
          echo "Install mongodb for optional local boot or use secrets ADMIN_URL/TECH_URL"
          node -e "console.log('deps ok')"
      - name: Auth smoke (external URLs optional)
        env:
          ADMIN_URL: ${{ secrets.STAGING_ADMIN_URL }}
          TECH_URL: ${{ secrets.STAGING_TECH_URL }}
        run: |
          if [ -z "$ADMIN_URL" ] || [ -z "$TECH_URL" ]; then
            echo "STAGING_ADMIN_URL / STAGING_TECH_URL not set — running syntax check only"
            node --check scripts/smoke-auth.js
            exit 0
          fi
          node scripts/smoke-auth.js

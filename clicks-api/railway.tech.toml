# Config-as-code for the clicks-tech-api Railway service ONLY.
# Set Railway -> clicks-tech-api -> Settings -> Config-as-code path to this file.
# Do not re-add a plain railway.toml: both services share the clicks-api source
# directory, so a single default-named file builds one image for both services.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.tech-api"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
# WS-I item 4 (scenario 66): without REDIS_URL the Socket.IO adapter is
# in-memory, so a second replica — or an overlapping zero-downtime deploy —
# splits dispatchers and customers across processes. Pin one replica and no
# overlap; the service must also set SINGLE_INSTANCE=true (boot refuses
# production without REDIS_URL or SINGLE_INSTANCE). Remove both lines once
# the Redis adapter is on.
numReplicas = 1
overlapSeconds = 0

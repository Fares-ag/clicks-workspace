name: clicks_admin
description: Clicks Admin — mobile dispatch and operations console
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: any
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.2
  socket_io_client: ^3.1.2
  google_maps_flutter: ^2.12.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/logo/
